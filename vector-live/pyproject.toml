[project]
name = "vector-live"
version = "0.1.0"
description = "Vector hardware audio diagnostics and GPT-Live companion"
requires-python = ">=3.12"
dependencies = [
  "anki-vector==0.6.0",
  "protobuf==3.20.3",
  "grpcio>=1.60,<2",
  "cryptography>=42",
  "aiohttp==3.14.3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:anki_vector.*", "ignore::DeprecationWarning:google.protobuf.*"]
